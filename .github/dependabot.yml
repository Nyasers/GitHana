version: 2
updates:
  # 依赖：单包仓库，pnpm（package.json 的 packageManager 钉版本）。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]

  # Actions：workflow 里 pin 的是具体补丁版，不靠浮动标签漂，靠这条提。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
