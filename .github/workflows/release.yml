# Release — 单包（universal）+ 发布 + 市场清单
#
# 触发：push tag v*（发版）／ workflow_dispatch（手动，只出 artifact 不建 release）
#
# 为什么只有一个包、不做平台矩阵：App 是 Web 应用，跨平台靠运行时解析
# （宿主 git → 本平台 vendor（若有）→ 系统 PATH），本来就不需要逐平台出包；
# 逐平台包是"非目标平台原生模块怎么裁剪"那类问题，本仓库没有原生模块，不引入这份复杂度。
# 进市场的也只有这一个 universal 包。
#
# 三段式：
#   create-release：先建 draft pre-release（已存在则跳过）——保证后续上传目标必然存在
#   package：单包。构建 UI → 自检 → 出包（ZIP + .sha256 + .entry.json）→ 拼 index.v2.json
#   publish：单点上传（--clobber）→ 硬校验必需资产（缺一即 fail，release 留 draft）→ 去 draft
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping create"
          else
            gh release create "${{ github.ref_name }}" \
              --draft --prerelease \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  package:
    needs: create-release
    # create-release 只在 tag 场景跑；dispatch 时它被 skip（非 failure），这里显式放行。
    if: ${{ needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # esbuild 的 postinstall 只做自检（二进制由可选依赖提供），跳过可避免
      # ERR_PNPM_IGNORED_BUILDS 把整条链退出 1。
      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build settings UI
        run: node scripts/build-ui.mjs

      - name: Self check
        run: node scripts/selfcheck.mjs --platform universal

      # 出包：ZIP + .sha256 + 市场条目 .entry.json
      # （官方校验器在本 runner 上没有时会在输出里标 unverified，不假装通过）
      - name: Package (universal)
        run: node scripts/pack.mjs --target universal --publisher "${{ github.repository_owner }}" --out releases

      # 市场清单：归档地址指向本次 tag 的 release 下载路径
      - name: Build market index
        run: |
          set -e
          node scripts/build-index.mjs \
            --entries releases \
            --include universal \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --source-id "${{ github.event.repository.name || 'githana' }}" \
            --name "GitHana" \
            --out releases/index.v2.json
          head -c 400 releases/index.v2.json

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-universal
          retention-days: 3
          path: |
            releases/*.zip
            releases/*.zip.sha256
            releases/*.entry.json
            releases/index.v2.json
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 单点上传（--clobber 幂等）
      - name: Upload release assets (single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            echo "  uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" --clobber
            found=$((found+1))
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.zip.sha256' -o -name 'index.v2.json' \) -print0)
          [ "$found" -gt 0 ] || { echo "::error::artifacts/ 里没有任何可发布文件"; exit 1; }

      # 硬校验：universal 包 + sha256 + 市场清单。缺一即 fail，release 留 draft
      - name: Verify required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          ID=$(node -p "require('./manifest.json').id")
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "=== release assets ==="; echo "$ASSETS"

          MISSING=()
          for f in "${ID}-v${VER}-universal.zip" "${ID}-v${VER}-universal.zip.sha256" "index.v2.json"; do
            echo "$ASSETS" | grep -qx "$f" || MISSING+=("$f")
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::缺少必需资产：${MISSING[*]}（release 保持 draft 供人工检查）"
            exit 1
          fi
          echo "✓ 必需资产齐备（universal 包 + sha256 + 市场清单）"

      - name: Un-draft (keep prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease --draft=false
