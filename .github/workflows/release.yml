# Release — 矩阵出包（4 平台 + universal 兜底）+ 单点发布
#
# 触发：push tag v*（发版）／ workflow_dispatch（手动，只出 artifact 不建 release）
#
# 三段式（对齐 dshana 的 release 骨架）：
#   create-release：先建 draft pre-release（已存在则跳过）——保证后续上传目标必然存在
#   package：矩阵并发，每目标一个 job；每 job 自包含（装依赖 + 重建该平台 vendor + 构建 UI +
#            自检 + 出包 + sha256），产物命名 <id>-v<version>-<target>.zip
#   publish：needs package。下载全部 artifact → 单点上传（--clobber，避免并发写同一 release）
#            → 硬校验必需资产（缺一即 fail，release 留 draft）→ 全部齐备才去掉 draft
#
# 为什么能在 ubuntu 上出全平台包：本项目是纯 JS；内嵌运行时按 target 从
# vendor/sources.json 重建（win32 的 gnupg 是 NSIS/7z 容器，所以先装 p7zip）。
# 与 dshana 的关键差异：我们没有需编译的原生 helper，所以不需要跨 OS runner。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping create"
          else
            gh release create "${{ github.ref_name }}" \
              --draft --prerelease \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

  package:
    needs: create-release
    # create-release 只在 tag 场景跑；dispatch 时它被 skip（非 failure），这里显式放行。
    if: ${{ needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, darwin-arm64, darwin-x64, linux-x64, universal]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # esbuild 的 postinstall 只做自检（二进制由可选依赖提供），跳过它可避免
      # ERR_PNPM_IGNORED_BUILDS 把整条链退出 1。
      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      # win32 的 gnupg 是 NSIS/7z 容器，需要 7z 才能只取 bin/
      - name: Install 7z (for the win32 gnupg container)
        if: matrix.target == 'win32-x64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Rebuild vendored runtimes for ${{ matrix.target }}
        if: matrix.target != 'universal'
        run: node scripts/fetch-vendor.mjs --platform ${{ matrix.target }}

      - name: Build settings UI
        run: node scripts/build-ui.mjs

      - name: Self check
        run: node scripts/selfcheck.mjs --platform ${{ matrix.target }}

      # 官方 creator 可用时会被 pack 内部调用作为额外校验；不可用时照常出包（产物标注 unverified）
      - name: Package ${{ matrix.target }}
        run: node scripts/pack.mjs --target ${{ matrix.target }} --publisher "${{ github.repository_owner }}" --out releases

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          retention-days: 3
          path: |
            releases/*.zip
            releases/*.zip.sha256
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 单点上传（--clobber 幂等）：多 job 并发写同一 release 有互相覆盖的窗口，故收在一处
      - name: Upload release assets (single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            echo "  uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" --clobber
            found=$((found+1))
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.zip.sha256' \) -print0)
          [ "$found" -gt 0 ] || { echo "::error::artifacts/ 里没有任何包"; exit 1; }

      # 硬校验：四个平台包 + universal 兜底，各带 sha256；缺一即 fail，release 留 draft
      - name: Verify required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          ID=$(node -p "require('./manifest.json').id")
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "=== release assets ==="; echo "$ASSETS"

          MISSING=()
          for t in win32-x64 darwin-arm64 darwin-x64 linux-x64 universal; do
            for f in "${ID}-v${VER}-${t}.zip" "${ID}-v${VER}-${t}.zip.sha256"; do
              echo "$ASSETS" | grep -qx "$f" || MISSING+=("$f")
            done
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::缺少必需资产：${MISSING[*]}（release 保持 draft 供人工检查）"
            exit 1
          fi
          echo "✓ 全部必需资产齐备（4 平台 + universal，各带 sha256）"

      - name: Un-draft (keep prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease --draft=false
