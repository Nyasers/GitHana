# CI — 三平台矩阵：重建内嵌运行时 + 检查链（不出包；出包与发版见 release.yml）
#
# 设计原则：CI 只是执行者，链在本仓库里（scripts/*.mjs），本地同一条命令：
#   pnpm install --ignore-scripts && pnpm run check
# vendor/ 不入 git；当前 sources.json 组件表为空（签名与 GitHub 请求都走随包纯 JS，无内嵌二进制），
# 所以三个平台完全同构，CI 不需要按平台拉取运行时。
#
# 诚实边界：官方 creator（validate_app / pack_app）不在本仓库。没配仓库变量
# HANA_APP_TOOLS_ROOT 时，release.yml 会明确说明"没有官方校验"，而不是静默成功。
name: app

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # esbuild 的 postinstall 只做自检（二进制由可选依赖提供），跳过可避免
      # ERR_PNPM_IGNORED_BUILDS 让整条链退出 1。
      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Rebuild vendored runtimes
        run: |
          node scripts/fetch-vendor.mjs --platform ${{ matrix.platform }}
          node scripts/fetch-vendor.mjs --platform ${{ matrix.platform }} --check

      # 与本地同一条链：白名单组装交付树 dist/ + 结构自检
      # （manifest / 全部服务端 JS 语法 / vendor 就绪性）。dist/ 与 ui/dist/ 不入库，现场生成。
      - name: Check chain
        run: pnpm run check

      # 派生门禁：拦住「改了 manifest 版本或实装依赖却忘了重生成」。
      # （THIRD_PARTY_NOTICES.md 与 skills/githana/references/*.md 入库，由 derive 任务生成；
      #   这里校验它们与实装内容一致。）
      # api-reference 要读上游权限表缓存——先拉一次（同一份数据，可重拉）。
      - name: Fetch upstream permission table
        run: node scripts/derive/fetch-permission-table.mjs

      - name: Derived files in sync
        run: node scripts/derive/index.mjs --check
