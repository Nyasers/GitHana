<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>签名公钥</title>
<style>
  /* GitHana 公钥卡页（App v2 流内卡）。
     宿主把流内卡的 route 解析成 /api/apps/<appId>/ui<route>（App ui/ 静态树），故本页是
     静态文档：加载后一次性取一次后端数据端点 /routes/pubkey（无 SSE、无轮询）。
     宿主主题经 hana-css 查询参数注入 stylesheet（已 root 化）；变量缺失时用纸张色兜底。
     宿主把 iframe 的 opacity 压到握手完成之后（hana.ready），故脚本第一时间握手。 */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 14px 16px 10px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text, #2A2622);
    background: var(--bg, #F5EFE4);
  }
  .card-title { font-size: 14px; font-weight: 600; letter-spacing: .02em; margin: 0 0 2px; }
  .card-sub { font-size: 12px; color: var(--text-muted, #6B6158); margin: 0 0 10px; }
  .fpr-row {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 13.5px; letter-spacing: .03em;
    background: var(--bg-card, #FBF7EE);
    border: 1px solid var(--border, #D8CFBE);
    border-radius: 9px; padding: 8px 11px;
    word-break: break-all; user-select: all;
  }
  .uid-row { font-size: 12.5px; color: var(--text-light, #4A433C); margin: 7px 2px 0; }
  button {
    display: block; width: 100%;
    margin: 11px 0 4px; padding: 8px 12px;
    font: inherit; font-size: 13px;
    background: var(--accent, #537D96); color: #fff;
    border: none; border-radius: 9px; cursor: pointer;
    transition: filter .15s ease;
  }
  button:hover:not(:disabled) { filter: brightness(.95); }
  button:disabled { opacity: .75; cursor: default; }
  button.ok { background: var(--success, #3F8F5F); }
  button.fail { background: var(--danger, #B0453E); }
  details {
    margin: 6px 0 0;
    border: 1px solid var(--border, #D8CFBE); border-radius: 9px;
    background: var(--bg-card, #FBF7EE);
  }
  details summary { padding: 7px 11px; font-size: 12.5px; color: var(--text-light, #4A433C); cursor: pointer; user-select: none; }
  details[open] summary { border-bottom: 1px solid var(--border, #D8CFBE); }
  pre.pubkey {
    margin: 0; padding: 10px 11px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    max-height: 190px; overflow: auto;
  }
  .steps {
    margin: 11px 0 2px; padding: 9px 11px;
    border-left: 3px solid var(--accent, #537D96);
    background: var(--bg-card, #FBF7EE);
    border-radius: 0 8px 8px 0;
    font-size: 12.5px; color: var(--text-light, #4A433C);
  }
  .steps b { color: var(--text, #2A2622); font-weight: 600; }
  .steps ol { margin: 4px 0 0; padding-left: 18px; }
  .steps code, .empty-box code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11.5px; background: var(--bg, #F5EFE4);
    border: 1px solid var(--border, #D8CFBE); border-radius: 4px; padding: 0 4px;
  }
  .empty-box {
    border: 1px dashed var(--border, #D8CFBE); border-radius: 9px;
    padding: 13px 13px 11px; background: var(--bg-card, #FBF7EE);
  }
  .empty-box .t { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .empty-box .d { font-size: 12.5px; color: var(--text-light, #4A433C); }
  .loading { color: var(--text-muted, #6B6158); font-size: 12.5px; }
</style>
</head>
<body>
<div id="gh-card-root"><p class="loading">正在读取公钥…</p></div>
<script>
(function () {
  "use strict";
  var PROTOCOL = "hana.plugin.ui";
  var VERSION = 1;
  var HOST_ORIGIN = new URLSearchParams(location.search).get("hana-host-origin") || "*";
  var PARENT = window.parent;
  var root = document.getElementById("gh-card-root");

  function post(m) { try { PARENT.postMessage(m, HOST_ORIGIN); } catch (e) { /* 宿主不在时忽略 */ } }
  function postEvent(type, payload) {
    var m = { protocol: PROTOCOL, version: VERSION, kind: "event", type: type };
    if (payload !== undefined) m.payload = payload;
    post(m);
  }
  // 握手：宿主把卡 iframe 压到 opacity 0 直到收到它。
  function handshake() { postEvent("hana.ready"); }
  // 报高：流内卡高度是 flexible，上报值经宿主 clamp 后落框。
  function reportSize() {
    var h = Math.ceil(document.body ? document.body.scrollHeight : 0) + 16;
    if (!h || h < 40) h = 40;
    postEvent("ui.resize", { height: h });
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // 主题：宿主经 hana-css 注入 stylesheet。
  var themeCss = new URLSearchParams(location.search).get("hana-css");
  if (themeCss) {
    var link = document.createElement("link");
    link.rel = "stylesheet"; link.href = themeCss;
    document.head.appendChild(link);
  }

  // 后端数据端点：基址从自身路径推出（App ui 文档总在 /api/apps/<appId>/ui/... 下），
  // 不写死 appId、不写根绝对 URL。宿主换前缀/换 id 都不影响。
  function dataUrl() {
    var m = /^(\/api\/apps\/[^/]+\/)ui(?:\/|$)/.exec(location.pathname || "");
    return m ? m[1] + "routes/pubkey?ts=" + Date.now() : null;
  }

  // surface 凭证：页面被宿主挂在租约路径下（/ui/_surface/<token>/...）时，凭证就在路径里，
  // 页面对自己后端路由的请求不会自动带上它。查询串形态（appSurfaceSession）优先。
  function surfaceCredential() {
    var q = new URLSearchParams(location.search).get("appSurfaceSession");
    if (q) return q;
    var m = /\/ui\/_surface\/([^/]+)\//.exec(location.pathname || "");
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }
  function authHeaders(extra) {
    var h = extra || {};
    var cred = surfaceCredential();
    if (cred) h["X-Hana-App-Surface-Session"] = cred;
    return h;
  }

  function renderEmpty() {
    root.innerHTML =
      '<div class="empty-box">' +
        '<div class="t">尚未生成签名密钥</div>' +
        '<div class="d">先运行工具 <code>gpg_keygen</code> 初始化隔离 git/GPG 环境（自动推导身份并生成密钥），' +
        '完成后再次调用 <code>gpg_pubkey</code>，本卡会带出真实公钥。</div>' +
      '</div>';
    reportSize();
  }

  function renderKey(data) {
    var fpr = data.fpr || "";
    var uid = data.uid || "";
    var pubkey = data.pubkey || "";
    root.innerHTML =
      '<div class="card-title">GPG 签名公钥</div>' +
      '<div class="card-sub">' + (fpr ? "完整指纹 " + esc(fpr.slice(0, 8)) + "…" + esc(fpr.slice(-8)) : "") + '</div>' +
      (fpr ? '<div class="fpr-row">' + esc(fpr) + '</div>' : "") +
      (uid ? '<div class="uid-row">' + esc(uid) + '</div>' : "") +
      '<button type="button" id="gh-copy">复制公钥到剪贴板</button>' +
      '<details id="gh-block"><summary>查看公钥全文</summary><pre class="pubkey">' + esc(pubkey) + '</pre></details>' +
      '<div class="steps"><b>上传 GitHub 验证签名</b><ol>' +
        '<li>点上方按钮复制公钥全文（或展开后手动选择复制）</li>' +
        '<li>打开 GitHub：<code>Settings → SSH and GPG keys → New GPG key</code></li>' +
        '<li>粘贴保存，此后本 App 的签名提交即显示 <code>Verified</code></li>' +
      '</ol></div>';

    var btn = document.getElementById("gh-copy");
    var btnTxt = btn.textContent;

    function fallbackSelectCopy(text) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok ? Promise.resolve() : Promise.reject(new Error("execCommand copy 失败"));
      } catch (err) { return Promise.reject(err); }
    }
    // 复制链：原生 Clipboard API 优先（App 已声明 app/ui.clipboard-write，宿主为 iframe 打开
    // clipboard-write 权限策略）→ execCommand 选区复制兜底。全败则展开全文提示手动复制。
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(function () { return fallbackSelectCopy(text); });
      }
      return fallbackSelectCopy(text);
    }

    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      btn.disabled = true;
      copyText(pubkey).then(function () {
        btn.classList.add("ok"); btn.textContent = "已复制到剪贴板";
        setTimeout(function () { btn.classList.remove("ok"); btn.textContent = btnTxt; btn.disabled = false; }, 1800);
      }).catch(function () {
        btn.classList.add("fail"); btn.textContent = "复制失败，请展开下方全文手动复制（Ctrl+C）";
        var d = document.getElementById("gh-block"); if (d) d.open = true;
        setTimeout(function () { btn.classList.remove("fail"); btn.textContent = btnTxt; btn.disabled = false; }, 2600);
      });
    });
    reportSize();
  }

  var url = dataUrl();
  if (!url) { renderEmpty(); }
  else {
    fetch(url, { cache: "no-store", credentials: "same-origin", headers: authHeaders({ Accept: "application/json" }) })
      .then(function (res) { if (!res.ok) throw new Error("pubkey HTTP " + res.status); return res.json(); })
      .then(function (data) {
        if (data && data.hasKey) renderKey(data); else renderEmpty();
      })
      .catch(function () { renderEmpty(); });
  }

  handshake();
  window.addEventListener("load", function () { setTimeout(reportSize, 80); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(reportSize, 60); });
  setTimeout(reportSize, 30);
})();
</script>
</body>
</html>
