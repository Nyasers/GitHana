# pnpm 11 把项目级设置放在这里（package.json 的 pnpm 字段它不读，写在那边会静默失效）。
#
# allowBuilds：esbuild 的 postinstall 只做自检（平台二进制由可选依赖提供），允许它是为了不再让
# `pnpm install` 以 ERR_PNPM_IGNORED_BUILDS 退出 1。
#
# supportedArchitectures：钥匙环是原生模块，每个平台一个包。只装构建机那份的话，ubuntu runner
# 出的包移植到 Windows 会报 Cannot find native binding。声明三 os × 两 cpu 之后，任何一台机器
# 都能把这六份装齐，pack 再按 --target 点名哪几份进产物。
allowBuilds:
  esbuild: true

supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - x64
    - arm64
